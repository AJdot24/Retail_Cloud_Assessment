# =====================================================================
# MySQL profile — run with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# =====================================================================
# Switch from H2 to MySQL is: this file (url/credentials) + a MySQL
# database named "ems". The Java/JPA code needs no changes. MySQL has
# different DDL syntax (AUTO_INCREMENT, no IF NOT EXISTS on indexes),
# so a MySQL-specific schema + seed script are referenced below.

spring.datasource.url=jdbc:mysql://localhost:3306/ems
spring.datasource.username=root
spring.datasource.password=root
spring.sql.init.schema-locations=classpath:schema-mysql.sql
spring.sql.init.data-locations=classpath:data-mysql.sql
