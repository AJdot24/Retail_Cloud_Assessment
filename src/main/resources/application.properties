# Application
spring.application.name=employee-management-system
server.port=8080

# H2 embedded database (file mode so data survives restarts)
#spring.datasource.url=jdbc:h2:file:./data/emsdb
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=


#Postgres Config

spring.datasource.url=jdbc:postgresql://localhost:5432/ems
spring.datasource.username=postgres
spring.datasource.password=root
spring.sql.init.data-locations=classpath:data-postgres.sql


#MySQL Config
#spring.datasource.url=jdbc:mysql://localhost:3306/ems
#spring.datasource.username=root
#spring.datasource.password=root
#spring.sql.init.schema-locations=classpath:schema-mysql.sql
#spring.sql.init.data-locations=classpath:data-mysql.sql

# Schema and seed data come from schema.sql and data.sql
# (this is also the "DB script" deliverable of the assignment)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Do not keep a Hibernate session open per request; all lazy loading
# happens inside transactional service methods before DTO mapping
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Dates serialized as ISO-8601 strings (e.g. 2024-01-15), not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# H2 web console for demo purposes: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
