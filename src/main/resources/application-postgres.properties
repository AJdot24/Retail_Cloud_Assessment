# =====================================================================
# PostgreSQL profile — run with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# =====================================================================
# Switch from H2 to PostgreSQL is: this file (url/credentials) + a
# PostgreSQL database named "ems". The Java/JPA code and schema.sql
# need no changes — schema.sql uses standard SQL (GENERATED BY DEFAULT
# AS IDENTITY, IF NOT EXISTS) that PostgreSQL supports natively.
# Only the seed script differs (ALTER SEQUENCE instead of H2 RESTART WITH).

spring.datasource.url=jdbc:postgresql://localhost:5432/ems
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.sql.init.data-locations=classpath:data-postgres.sql
